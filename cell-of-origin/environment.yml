# Host-side toolkit for the cell-of-origin coverage steps:
#   01_coverage.sh -- sambamba (depth region) + samtools (idxstats).
# 00_build_sites.sh and refs/download_refs_coo.sh use only curl + awk (base tools).
# R / tidyverse for 02_plot_coverage.R is handled by the existing R library, not here.
#
#   micromamba create -f environment.yml
#   micromamba activate genomics-tools
name: genomics-tools
channels:
  - conda-forge
  - bioconda
dependencies:
  - samtools
  - sambamba
